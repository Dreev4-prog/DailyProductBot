<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Корзина — DT Team V2</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f1115;color:#fff;margin:0}
.wrap{max-width:1100px;margin:auto;padding:24px}
h1{font-size:30px}.brand{color:#f2c94c}
.card{background:#191d24;border:1px solid #2b313c;border-radius:16px;padding:18px}
button{background:#f2c94c;border:0;border-radius:10px;padding:10px;font-weight:700;cursor:pointer}
.danger{background:#ef5350;color:#fff}
table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #2b313c;text-align:left}
a{color:#f2c94c}
</style>
</head>
<body><div class="wrap">
<h1>⚡ <span class="brand">DT TEAM</span> — Корзина</h1>
<p><a href="/">← Вернуться в панель</a></p>
<div class="card"><table>
<tr><th>ID</th><th>Категория</th><th>Название</th><th>Цена</th><th>Действия</th></tr>
{% for p in rows %}
<tr>
<td>{{p.id}}</td><td>{{p.category}}</td><td>{{p.title}}</td><td>{{p.price_text}}</td>
<td>
<form method="post" action="/products/{{p.id}}/restore" style="display:inline"><button>Восстановить</button></form>
<form method="post" action="/products/{{p.id}}/hard-delete" style="display:inline" onsubmit="return confirm('Удалить товар навсегда? Это действие нельзя отменить.')">
<button class="danger">Удалить навсегда</button>
</form>
</td>
</tr>
{% endfor %}
</table></div>
</div></body></html>
