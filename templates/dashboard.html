<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DT Team V2</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f1115;color:#fff;margin:0}
.wrap{max-width:1100px;margin:auto;padding:24px}
h1{font-size:30px}.brand{color:#f2c94c}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:#191d24;border:1px solid #2b313c;border-radius:16px;padding:18px}
.metric{font-size:32px;font-weight:700}.form{display:grid;gap:10px}
input,textarea{background:#101319;color:#fff;border:1px solid #343b47;border-radius:10px;padding:12px}
button{background:#f2c94c;border:0;border-radius:10px;padding:12px;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #2b313c;text-align:left}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<h1>⚡ <span class="brand">DT TEAM</span> V2</h1>
<div class="grid">
<div class="card"><div>Пользователей</div><div class="metric">{{ users }}</div></div>
<div class="card"><div>Активных</div><div class="metric">{{ active }}</div></div>
<div class="card"><div>Товаров</div><div class="metric">{{ products }}</div></div>
</div>
<h2>Добавить товар</h2>
<div class="card">
<form class="form" method="post" action="/products" enctype="multipart/form-data">
<input name="category" placeholder="Категория" required>
<input name="title" placeholder="Название" required>
<textarea name="description" placeholder="Описание" required></textarea>
<input name="price" placeholder="Цена" required>
<input type="file" name="image" accept="image/*" required>
<button>Добавить товар</button>
</form>
</div>
<p><a href="/trash" style="color:#f2c94c">🗑 Открыть корзину</a></p>
<h2>Последние товары</h2>
<div class="card"><table>
<tr><th>ID</th><th>Категория</th><th>Название</th><th>Цена</th><th>Статус</th><th></th></tr>
{% for p in rows %}
<tr><td>{{p.id}}</td><td>{{p.category}}</td><td>{{p.title}}</td><td>{{p.price_text}}</td>
<td>{{"Активен" if p.active else "Скрыт"}}</td>
<td>
<form method="post" action="/products/{{p.id}}/toggle" style="display:inline">
<button>{{"Скрыть" if p.active else "Включить"}}</button>
</form>
<form method="post" action="/products/{{p.id}}/delete" style="display:inline" onsubmit="return confirm('Переместить товар в корзину?')">
<button>В корзину</button>
</form>
</td></tr>
{% endfor %}
</table></div>
</div></body></html>
